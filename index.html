<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7VN Gallery | Deliver photos to your clients</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>7VN STUDIOS</b></header><main>
<h2 id="h">Sign in</h2><p>Upload your photos, get a private link, and send it to your client on WhatsApp.</p>
<form id="f"><input id="e" type="email" placeholder="Email" required autocomplete="email"><input id="p" type="password" placeholder="Password (6 or more characters)" required minlength="6" autocomplete="current-password"><button id="b">Sign in</button><p class="err" id="m"></p></form>
<button class="link" id="s">New here? Create an account</button></main>
<script>
const $=s=>document.querySelector(s);let mode='login';if(localStorage.t)location='/app.html';
$('#s').onclick=()=>{mode=mode=='login'?'signup':'login';$('#h').textContent=mode=='login'?'Sign in':'Create your account';$('#b').textContent=mode=='login'?'Sign in':'Create account';$('#s').textContent=mode=='login'?'New here? Create an account':'Have an account? Sign in'};
$('#f').onsubmit=async ev=>{ev.preventDefault();$('#m').textContent='Please wait…';const r=await fetch('/api/auth',{method:'POST',body:JSON.stringify({mode,email:$('#e').value.trim(),password:$('#p').value})}),j=await r.json();
 if(!r.ok)return $('#m').textContent=j.error;localStorage.t=j.token;localStorage.r=j.refresh;location='/app.html'};
</script></body></html>
