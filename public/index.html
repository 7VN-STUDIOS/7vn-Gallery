<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7VN Gallery | Deliver photos to your clients</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="https://7vnstudios.com.ng" target="_blank" rel="noopener" aria-label="7VN Studios website"><img src="/logo.png" alt="7VN Studios" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'7VN STUDIOS'}))"></a></header>
<main class="narrow">
<h2 id="h">Sign in</h2><p>Upload your photos, get a private link, and send it to your client on WhatsApp.</p>
<form id="f"><input id="e" type="email" placeholder="Email" required autocomplete="email">
<div class="pw"><input id="p" type="password" placeholder="Password (6 or more characters)" required minlength="6" autocomplete="current-password"><button type="button">Show</button></div>
<div class="pw" id="cw" hidden><input id="p2" type="password" placeholder="Confirm password" minlength="6" autocomplete="new-password"><button type="button">Show</button></div>
<button id="b">Sign in</button><p class="err" id="m"></p></form>
<button class="link" id="s">New here? Create an account</button></main>
<footer>Powered by <a href="https://7vnstudios.com.ng">7VN STUDIOS</a></footer>
<script>
const $=s=>document.querySelector(s);let mode='login';if(localStorage.t)location='/app.html';
document.querySelectorAll('.pw button').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,h=i.type=='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show'});
$('#s').onclick=()=>{mode=mode=='login'?'signup':'login';const up=mode=='signup';$('#h').textContent=up?'Create your account':'Sign in';$('#b').textContent=up?'Create account':'Sign in';$('#s').textContent=up?'Have an account? Sign in':'New here? Create an account';$('#cw').hidden=!up;$('#p2').required=up;$('#p').autocomplete=up?'new-password':'current-password';$('#m').textContent=''};
$('#f').onsubmit=async ev=>{ev.preventDefault();if(mode=='signup'&&$('#p').value!==$('#p2').value)return $('#m').textContent='Passwords do not match.';$('#m').textContent='Please wait…';
 const r=await fetch('/api/auth',{method:'POST',body:JSON.stringify({mode,email:$('#e').value.trim(),password:$('#p').value})}),j=await r.json();
 if(!r.ok)return $('#m').textContent=j.error;localStorage.t=j.token;localStorage.r=j.refresh;location='/app.html'};
</script></body></html>
