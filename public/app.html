<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dashboard | 7VN Gallery</title><link rel="stylesheet" href="/style.css"></head><body>
<header><img src="/logo.png" alt="7VN Studios" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'7VN STUDIOS'}))"></header>
<main class="narrow">
<p id="me" style="margin-bottom:0"></p><div class="bar"><i id="us"></i></div><button class="link" id="out">Sign out</button>
<h2>New gallery</h2>
<input id="gt" placeholder="Gallery name, for example Adebayo Wedding">
<select id="gd"><option value="60">Link expires in 60 days</option><option value="30">Link expires in 30 days</option><option value="90">Link expires in 90 days</option><option value="0">Never expires</option></select>
<button id="gc">Create gallery</button>
<h2>Your galleries</h2><div id="gl"></div>
<section id="up" hidden><h2 id="ut"></h2>
<input id="sg" placeholder="Segment (optional), for example Reception">
<label class="drop" id="dz"><input id="fl" type="file" accept="image/*" multiple><span id="dt">Tap to choose photos, or drag them here</span></label>
<button id="go">Upload photos</button><p id="sum"></p><div id="lg"></div></section></main>
<script src="/app.js"></script><script>
if(!localStorage.t)location='/';let cur;const GB=1073741824;
$('#out').onclick=()=>{localStorage.clear();location='/'};
const pick=()=>{const n=$('#fl').files.length;$('#dt').textContent=n?`${n} photo${n>1?'s':''} selected`:'Tap to choose photos, or drag them here'};
$('#fl').onchange=pick;
['dragover','dragenter'].forEach(e=>$('#dz').addEventListener(e,ev=>{ev.preventDefault();$('#dz').classList.add('on')}));
['dragleave','drop'].forEach(e=>$('#dz').addEventListener(e,()=>$('#dz').classList.remove('on')));
$('#dz').addEventListener('drop',ev=>{ev.preventDefault();$('#fl').files=ev.dataTransfer.files;pick()});
async function load(){const m=await api('me');$('#me').textContent=`${m.email}: ${(m.used/GB).toFixed(2)} of ${(m.quota/GB).toFixed(0)} GB used`;$('#us').style.width=Math.min(100,m.used/m.quota*100)+'%';
 const{galleries}=await api('galleries');$('#gl').innerHTML=galleries.length?'':'<p>No galleries yet. Create your first one above.</p>';
 galleries.forEach(g=>{const link=`${location.origin}/g/${g.token}`,d=document.createElement('div'),h=document.createElement('h3'),s=document.createElement('small'),a=document.createElement('div');d.className='card';a.className='acts';
  h.textContent=g.title;s.textContent=`${g.count} photo${g.count==1?'':'s'} · ${g.expires_at?'Expires '+new Date(g.expires_at).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'Never expires'}`;
  const mk=(t,f,c)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;if(c)b.className=c;return b};
  const wa=document.createElement('a');wa.textContent='WhatsApp';wa.target='_blank';wa.href='https://wa.me/?text='+encodeURIComponent(`Your photos are ready: ${link}`);
  a.append(mk('Add photos',()=>{cur=g;$('#ut').textContent='Add photos to '+g.title;$('#up').hidden=0;$('#up').scrollIntoView()}),
   mk('Copy link',async b=>{await navigator.clipboard.writeText(link);alert('Link copied. Send it to your client.')},'ghost'),wa,mk('Preview',()=>open(link),'ghost'),
   mk('Delete',async()=>{if(confirm('Delete this gallery and all its photos?')){await api('galleries/'+g.id,{method:'DELETE'});$('#up').hidden=1;load()}},'ghost'));
  d.append(h,s,a);$('#gl').append(d)})}
$('#gc').onclick=async()=>{try{await api('galleries',{method:'POST',body:JSON.stringify({title:$('#gt').value.trim(),days:+$('#gd').value})});$('#gt').value='';load()}catch(x){alert(x.message)}};
async function thumb(f){const b=await createImageBitmap(f),s=Math.min(1,600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
function put(path,body,type,cb){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/'+path);x.setRequestHeader('authorization','Bearer '+localStorage.t);x.setRequestHeader('x-type',type);
 if(cb)x.upload.onprogress=e=>cb(e.loaded/e.total*100);x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?ok(j):no(new Error(j.error||'Upload failed'))};x.onerror=()=>no(new Error('Network problem'));x.send(body)})}
$('#go').onclick=async()=>{const fs=[...$('#fl').files];if(!fs.length)return alert('Choose at least one photo');$('#go').disabled=1;$('#lg').innerHTML='';let ok=0;
 for(const f of fs){const r=document.createElement('p'),b=document.createElement('div');r.textContent=f.name;b.className='bar';b.innerHTML='<i></i>';$('#lg').append(r,b);
  try{const j=await put(`upload?g=${cur.id}&seg=${encodeURIComponent($('#sg').value)}&name=${encodeURIComponent(f.name)}`,f,f.type,p=>b.firstChild.style.width=p+'%');
   try{await put('upload?thumb='+j.id,await thumb(f),'image/jpeg')}catch(e){}ok++;r.textContent='Done: '+f.name}catch(x){r.textContent='Failed: '+f.name+' ('+x.message+')'}}
 $('#sum').textContent=`${ok} of ${fs.length} uploaded and verified.`+(ok<fs.length?' Please upload the failed ones again.':'');$('#go').disabled=0;$('#fl').value='';pick();load()};
load().catch(x=>alert(x.message));
</script></body></html>
