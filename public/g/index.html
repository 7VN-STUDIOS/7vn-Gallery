<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Your photos | 7VN Studios</title><link rel="stylesheet" href="/style.css"></head><body>
<header><img src="/logo.png" alt="7VN Studios" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'7VN STUDIOS'}))"></header>
<main><div class="hero"><h1 id="h">Loading your photos…</h1><p id="s"></p></div><div class="tabs" id="t"></div><div class="masonry" id="d"></div></main>
<footer>Delivered by <a href="https://7vnstudios.com.ng">7VN STUDIOS</a></footer>
<div id="lb"><div class="bar2"><span id="ct"></span><button class="x" id="x" aria-label="Close">&times;</button></div>
<button class="n" id="pv" style="left:10px" aria-label="Previous">&#8249;</button><img id="li" alt=""><button class="n" id="nx" style="right:10px" aria-label="Next">&#8250;</button><a class="d" id="dl">Download original</a></div>
<script>
const $=s=>document.querySelector(s),T=location.pathname.split('/')[2],U=p=>`/api/img/${p.id}?t=${T}`;let data,cur=[],idx=0;
fetch('/api/g/'+T).then(async r=>{const j=await r.json();if(!r.ok){$('#h').textContent='Gallery unavailable';return $('#s').textContent=j.error}
 data=j;$('#h').textContent=j.title;if(j.cover){const h=$('.hero');h.classList.add('cov');h.style.backgroundImage=`linear-gradient(#0008,#000d),url(/api/img/${j.cover}?t=${T}&thumb=1)`}document.title=j.title+' | 7VN Studios';const n=j.segments.reduce((a,s)=>a+s.photos.length,0);$('#s').textContent=`${n} photo${n==1?'':'s'}`;
 if(j.segments.length>1){j.segments.unshift({name:'All',photos:[].concat(...j.segments.map(s=>s.photos))});j.segments.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${s.name} (${s.photos.length})`;b.onclick=()=>show(i);$('#t').append(b)})}
 show(0)}).catch(()=>{$('#h').textContent='Something went wrong';$('#s').textContent='Please refresh the page.'});
function show(i){[...$('#t').children].forEach((b,j)=>b.className=i==j?'on':'');$('#d').innerHTML='';cur=data.segments[i]?.photos||[];
 cur.forEach((p,k)=>{const w=document.createElement('div'),im=new Image(),a=document.createElement('a');im.loading='lazy';im.alt=p.name;im.src=U(p)+'&thumb=1';im.onerror=()=>{im.onerror=null;im.src=U(p)};im.onclick=()=>open(k);a.textContent='Download';a.href=U(p)+'&dl=1';w.append(im,a);$('#d').append(w)});scrollTo({top:0})}
function open(k){idx=(k+cur.length)%cur.length;const p=cur[idx],im=$('#li');im.src=U(p)+'&thumb=1';const f=new Image();f.onload=()=>{if(cur[idx]===p)im.src=f.src};f.src=U(p);$('#dl').href=U(p)+'&dl=1';$('#ct').textContent=`${idx+1} / ${cur.length}`;$('#lb').style.display='flex'}
const close=()=>{$('#lb').style.display='none';const e=$('#d').children[idx];if(e)e.scrollIntoView({block:'center'})};$('#x').onclick=close;$('#pv').onclick=()=>open(idx-1);$('#nx').onclick=()=>open(idx+1);
addEventListener('keydown',e=>{if($('#lb').style.display!='flex')return;if(e.key=='Escape')close();if(e.key=='ArrowLeft')open(idx-1);if(e.key=='ArrowRight')open(idx+1)});
$('#t').addEventListener('wheel',e=>{const t=$('#t');if(t.scrollWidth>t.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){t.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
let sx=0;$('#lb').addEventListener('touchstart',e=>sx=e.touches[0].clientX);$('#lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)open(idx+(d<0?1:-1))});
</script></body></html>
